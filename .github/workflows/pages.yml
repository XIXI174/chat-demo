name: Check Web (type + lint)

# 纯检查，不再部署 Pages。
# 历史：这个 workflow 原来负责部署 GitHub Pages，但后来新增了 Deploy PWA，
# 两个 workflow 抢同一个 github-pages 环境会互相覆盖根站点。
# 现在 Pages 统一由 .github/workflows/pwa.yml 部署（PWA 放根路径），
# 这里只保留类型检查 + lint + 一次前端构建作为质量门禁。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Build web bundle
        run: NODE_ENV=production pnpm exec rspack build -c rspack.config.ts
